<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISY DESIGNER - ULTRA PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* BASIC RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
scroll-behavior:smooth;
}

body{
background:#030712;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
.bg-animation{
position:fixed;
width:100%;
height:100%;
z-index:-5;
background:#030712;
}

.circle{
position:absolute;
border-radius:50%;
filter:blur(120px);
animation:move 15s infinite alternate;
}

.circle1{
width:400px;
height:400px;
background:#8b5cf6;
top:-100px;
left:-100px;
opacity:0.35;
}

.circle2{
width:350px;
height:350px;
background:#06b6d4;
bottom:-100px;
right:-100px;
opacity:0.3;
}

@keyframes move{
from{transform:translate(0,0);}
to{transform:translate(120px,-80px);}
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
padding:25px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:800;
background:linear-gradient(to right,#8b5cf6,#06b6d4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:white;
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
justify-content:space-between;
align-items:center;
padding:140px 8%;
gap:60px;
}

.hero-text h1{
font-size:80px;
font-weight:900;
}

.hero-text span{
background:linear-gradient(to right,#8b5cf6,#06b6d4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.typing{
color:#06b6d4;
font-size:24px;
margin:15px 0;
}

/* BUTTONS */
.btn{
padding:15px 30px;
border-radius:12px;
text-decoration:none;
font-weight:600;
display:inline-block;
}

.primary{
background:linear-gradient(to right,#8b5cf6,#06b6d4);
color:white;
}

.secondary{
background:rgba(255,255,255,0.05);
color:white;
}

/* SECTIONS */
section{
padding:120px 8%;
}

.title{
text-align:center;
font-size:50px;
margin-bottom:60px;
}

/* CARDS */
.card{
background:rgba(255,255,255,0.04);
padding:30px;
border-radius:20px;
}

/* CONTACT */
.contact-box{
max-width:700px;
margin:auto;
padding:40px;
background:rgba(255,255,255,0.04);
border-radius:25px;
}

input,textarea{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.05);
color:white;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
color:#94a3b8;
}

/* WHATSAPP BUTTON 🔥 */
.whatsapp{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
background:#25D366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
color:white;
text-decoration:none;
box-shadow:0 0 20px rgba(37,211,102,0.6);
animation:float 3s infinite ease-in-out;
z-index:9999;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg-animation">
<div class="circle circle1"></div>
<div class="circle circle2"></div>
</div>

<!-- NAV -->
<nav>
<div class="logo">RISY DESIGNER</div>
<ul>
<li><a href="#home">Home</a></li>
<li><a href="#services">Services</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<!-- HERO -->
<section class="hero" id="home">

<div class="hero-text">

<h1>Modern <span>IT</span> Solutions</h1>

<div class="typing" id="typing"></div>

<p>Premium Web Design & Development Services</p>

<a href="#contact" class="btn primary">Start Project</a>
<a href="#services" class="btn secondary">View Work</a>

</div>

</section>

<!-- SERVICES -->
<section id="services">

<h2 class="title">Services</h2>

<div class="card">Web Development</div>

</section>

<!-- CONTACT -->
<section id="contact">

<h2 class="title">Contact</h2>

<div class="contact-box">

<input placeholder="Name">
<input placeholder="Email">
<textarea placeholder="Message"></textarea>

<button class="btn primary">Send</button>

</div>

</section>

<!-- FOOTER -->
<footer>
© 2026 RISY DESIGNER
</footer>

<!-- WHATSAPP BUTTON 🔥 -->
<a class="whatsapp"
href="https://wa.me/94771815849?text=Hi%20I%20need%20a%20website%20design"
target="_blank">

💬

</a>

<!-- SCRIPT -->
<script>

const texts=["Web Developer","Designer","Software Developer"];
let i=0,j=0;
const el=document.getElementById("typing");

function type(){
if(j<texts[i].length){
el.innerHTML+=texts[i][j++];
setTimeout(type,100);
}else{
setTimeout(erase,1000);
}
}

function erase(){
if(j>0){
el.innerHTML=texts[i].substring(0,--j);
setTimeout(erase,50);
}else{
i=(i+1)%texts.length;
setTimeout(type,500);
}
}

type();

</script>

</body>
</html>
