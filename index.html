<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISY ULTRA PRO v2</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
scroll-behavior:smooth;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

.blob{
position:absolute;
width:300px;
height:300px;
filter:blur(120px);
opacity:0.4;
animation:float 10s infinite alternate;
}

.b1{background:#8b5cf6;top:-50px;left:-50px;}
.b2{background:#06b6d4;bottom:-80px;right:-80px;}

@keyframes float{
from{transform:translate(0,0);}
to{transform:translate(100px,-80px);}
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:900;
background:linear-gradient(to right,#8b5cf6,#06b6d4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav button{
padding:10px 20px;
border:none;
border-radius:10px;
background:linear-gradient(to right,#8b5cf6,#06b6d4);
color:white;
cursor:pointer;
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:120px 8%;
gap:40px;
}

.hero h1{
font-size:65px;
}

.hero span{
color:#06b6d4;
}

.typing{
color:#06b6d4;
font-size:22px;
height:30px;
margin:15px 0;
}

/* BUTTON */
.btn{
display:inline-block;
padding:14px 28px;
border-radius:12px;
text-decoration:none;
margin-right:10px;
}

.primary{
background:linear-gradient(to right,#8b5cf6,#06b6d4);
color:white;
}

/* CARD */
.card{
width:350px;
height:450px;
border-radius:20px;
overflow:hidden;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* SERVICES */
section{
padding:100px 8%;
}

.title{
text-align:center;
font-size:45px;
margin-bottom:50px;
}

.title span{color:#06b6d4;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.box{
padding:25px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
}

/* CONTACT */
input,textarea{
width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.05);
color:white;
}

button.send{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:linear-gradient(to right,#8b5cf6,#06b6d4);
}

/* WHATSAPP BUTTON */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
width:60px;
height:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
text-decoration:none;
}

/* LOGIN MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.boxlogin{
background:#111827;
padding:30px;
border-radius:15px;
width:300px;
}

.close{
float:right;
cursor:pointer;
color:red;
}

</style>

</head>

<body>

<div class="bg">
<div class="blob b1"></div>
<div class="blob b2"></div>
</div>

<!-- NAV -->
<nav>
<div class="logo">RISY PRO</div>
<button onclick="openLogin()">Login</button>
</nav>

<!-- HERO -->
<section class="hero">

<div>
<h1>Next Level <span>Web</span> Design</h1>

<div class="typing" id="typing"></div>

<a href="#contact" class="btn primary">Start Project</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
</div>

</section>

<!-- SERVICES -->
<section>
<h2 class="title">My <span>Services</span></h2>

<div class="grid">
<div class="box">Web Design</div>
<div class="box">UI/UX</div>
<div class="box">Software Dev</div>
</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2 class="title">Contact <span>Me</span></h2>

<input type="text" placeholder="Name">
<input type="email" placeholder="Email">
<textarea placeholder="Message"></textarea>

<button class="send">Send</button>
</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/94771815849" target="_blank">
💬
</a>

<!-- LOGIN MODAL -->
<div class="modal" id="modal">

<div class="boxlogin">
<span class="close" onclick="closeLogin()">X</span>

<h3>Login</h3>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button class="send">Login</button>

</div>

</div>

<script>

// typing
let words=["Web Developer","UI Designer","Software Engineer"];
let i=0,j=0,el=document.getElementById("typing");

function type(){
if(j<words[i].length){
el.innerHTML+=words[i][j++];
setTimeout(type,100);
}else{
setTimeout(erase,1000);
}
}

function erase(){
if(j>0){
el.innerHTML=words[i].substring(0,--j);
setTimeout(erase,50);
}else{
i=(i+1)%words.length;
setTimeout(type,300);
}
}

type();

// login
function openLogin(){
document.getElementById("modal").style.display="flex";
}

function closeLogin(){
document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
